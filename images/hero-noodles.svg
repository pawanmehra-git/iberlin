<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </linearGradient>
    <pattern id="noodles" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M10,50 Q30,30 50,50 T90,50" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none"/>
      <path d="M10,60 Q30,40 50,60 T90,60" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
      <path d="M10,70 Q30,50 50,70 T90,70" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none"/>
    </pattern>
  </defs>
  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#noodles)"/>
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white" text-shadow="2px 2px 4px rgba(0,0,0,0.5)">Premium Asian Noodles</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" text-shadow="1px 1px 2px rgba(0,0,0,0.5)">Authentic Flavors • Premium Quality</text>
</svg>
